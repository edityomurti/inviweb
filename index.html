<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vera &amp; Edityo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel greeting-page is-current" aria-label="Greeting">
        <img class="foliage foliage-side" src="./assets/ornaments/foliage-side.png" alt="" />
        <img class="foliage foliage-base" src="./assets/ornaments/foliage-base.png" alt="" />
        <img class="ornament ornament-tl" src="./assets/ornaments/monstera.svg" alt="" />
        <img class="ornament ornament-tr-palm" src="./assets/ornaments/palm.svg" alt="" />
        <img class="ornament ornament-br banana" src="./assets/ornaments/banana.svg" alt="" />
        <img class="ornament ornament-br-front" src="./assets/ornaments/monstera.svg" alt="" />

        <div class="panel-inner">
          <p class="kicker">Dear</p>
          <p id="invitee-name" class="script guest-name"></p>
          <button type="button" class="leaf-btn" id="open-invite">
            <span class="leaf-btn-icon" aria-hidden="true"></span>
            Open invitation
          </button>
        </div>
      </section>

      <section class="panel hero" aria-label="Invitation" aria-hidden="true">
        <img class="foliage foliage-side" src="./assets/ornaments/foliage-side.png" alt="" />
        <img class="foliage foliage-base" src="./assets/ornaments/foliage-base.png" alt="" />
        <img class="ornament ornament-tl" src="./assets/ornaments/monstera.svg" alt="" />
        <img class="ornament ornament-tl-palm" src="./assets/ornaments/palm.svg" alt="" />
        <img class="ornament ornament-tr-palm" src="./assets/ornaments/palm.svg" alt="" />
        <img class="ornament ornament-tr-colo" src="./assets/ornaments/colocasia.svg" alt="" />
        <img class="ornament ornament-ml" src="./assets/ornaments/colocasia.svg" alt="" />
        <img class="ornament ornament-br banana" src="./assets/ornaments/banana.svg" alt="" />
        <img class="ornament ornament-br-front" src="./assets/ornaments/monstera.svg" alt="" />
        <img class="ornament ornament-br-colo" src="./assets/ornaments/colocasia.svg" alt="" />
        <img class="ornament ornament-br-palm" src="./assets/ornaments/palm.svg" alt="" />

        <div class="panel-inner">
          <p id="invite-line" class="kicker"></p>
          <h1 class="names">
            <span id="person-a" class="script name"></span>
            <span class="and">and</span>
            <span id="person-b" class="script name"></span>
          </h1>
          <p id="date-line" class="date"></p>
        </div>
      </section>

      <section class="panel schedule" aria-label="Schedule" aria-hidden="true">
        <img class="foliage foliage-side flip" src="./assets/ornaments/foliage-side.png" alt="" />
        <img class="ornament ornament-tl small" src="./assets/ornaments/monstera.svg" alt="" />
        <img class="ornament ornament-tr" src="./assets/ornaments/palm.svg" alt="" />
        <img class="ornament ornament-tr-colo mid" src="./assets/ornaments/colocasia.svg" alt="" />
        <img class="ornament ornament-bl" src="./assets/ornaments/banana.svg" alt="" />
        <img class="ornament ornament-bl-front" src="./assets/ornaments/monstera.svg" alt="" />
        <img class="ornament ornament-br-palm low" src="./assets/ornaments/palm.svg" alt="" />

        <div class="panel-inner">
          <h2 class="script section-title">The Day</h2>
          <ul id="schedule-list" class="schedule-list"></ul>
        </div>
      </section>

      <section class="panel venue" aria-label="Venue" aria-hidden="true">
        <img class="foliage foliage-base" src="./assets/ornaments/foliage-base.png" alt="" />
        <img class="ornament ornament-tl-palm faint" src="./assets/ornaments/palm.svg" alt="" />
        <img class="ornament ornament-tr-colo" src="./assets/ornaments/colocasia.svg" alt="" />
        <img class="ornament ornament-br modest banana" src="./assets/ornaments/banana.svg" alt="" />
        <img class="ornament ornament-br-front modest" src="./assets/ornaments/monstera.svg" alt="" />
        <img class="ornament ornament-br-colo" src="./assets/ornaments/colocasia.svg" alt="" />
        <img class="ornament ornament-br-palm" src="./assets/ornaments/palm.svg" alt="" />
        <img class="ornament ornament-bl small-leaf" src="./assets/ornaments/banana.svg" alt="" />

        <div class="panel-inner">
          <h2 class="script section-title">Where</h2>
          <p id="venue-name" class="venue-name"></p>
          <p id="venue-address" class="venue-address"></p>
          <a id="maps-link" class="maps-link" href="#" target="_blank" rel="noopener noreferrer"
            >Open in Google Maps</a
          >
          <footer class="closing">
            <p id="footer-names" class="script footer-names"></p>
            <p id="footer-date" class="date"></p>
          </footer>
        </div>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
